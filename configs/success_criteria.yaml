# Phase 2 - success criteria, fixed BEFORE any model is trained.
# status: proposed -> confirmed by the researcher -> locked with `python -m src.evaluation.criteria --lock`.
# Once locked, the file's checksum is recorded in configs/success_criteria.lock.json and every
# evaluation script refuses to run if this file has changed.
status: confirmed
proposed_on: 2026-10-15
confirmed_on: 2026-10-15   # researcher accepted all numbers; targets and model rule set by the researcher

# ---------------------------------------------------------------------------------------------
# General rules (apply to every target)
# ---------------------------------------------------------------------------------------------
general:
  baselines:
    regression: mean of the training-set Z-score
    classification_labels: majority class of the training set
    classification_probabilities: training-set class frequencies for every student
  confidence_intervals:
    method: percentile bootstrap on the test set
    resamples: 2000
    level: 0.95
    paired: true            # model and baseline scored on the same resampled students
  verdict_rule:
    met: point estimate meets the threshold AND the 95% CI of the paired difference with the baseline lies entirely on the better side
    partly_met: point estimate meets the threshold but the CI crosses the threshold or zero
    not_met: point estimate does not meet the threshold
  model_comparison_rule: >-
    Model A is called better than model B only if the 95% paired-bootstrap CI of the difference in
    the primary metric excludes zero; otherwise they are reported as not distinguishable.
  model_selection_rule: >-
    Stage 1 (researcher's decision): every architecture is built as ONE multi-output network with a
    head for each target. The architecture with the best mean rank of the cross-validated primary
    metrics across all targets is selected; if several are within one standard deviation, the one
    with the fewest trainable parameters is chosen. Selection is made before the test set is opened.
  weakness_rule: >-
    Stage 2, decided on training-set cross-validation only: the selected multi-output model is weak
    for a target if (a) its cross-validated primary metric does not meet that target's minimum
    against the baseline, or (b) it shows negative transfer against the single-task network of the
    same architecture. For each weak target only, the best single-task network (same selection rule)
    is used instead. Both the multi-output and the single-task results are reported.
  reference_models: trivial baselines only (no linear or logistic regression reference, researcher's decision)
  tabpfn: >-
    Included as a candidate at the researcher's request, but NOT approved by the supervisor; reported
    with that label. Run with a single estimator (n_estimators = 1) so that it does not average
    several internal predictions, which would break the no-ensemble rule.
  cross_validation:
    scheme: repeated stratified k-fold inside the training set
    folds: 5
    repeats: 3
    max_spread:
      f1_like_sd: 0.05      # SD of macro F1 across the 15 folds
      mae_cv: 0.10          # SD / mean of MAE across the 15 folds
  overfitting:
    max_gap_classification_macro_f1: 0.10   # train minus validation
    max_gap_regression_mae_relative: 0.20   # (validation MAE - train MAE) / train MAE
  repeated_seeds: 5          # MLP and other networks: report mean and SD over 5 seeds; never average predictions

# ---------------------------------------------------------------------------------------------
# Prediction targets (final definitions and class lists are fixed in Phase 3)
# ---------------------------------------------------------------------------------------------
targets:
  zscore:
    kind: regression
    primary_metric: mae
    secondary_metrics: [rmse, r2, spearman]
    minimum:
      mae_reduction_vs_baseline: 0.10       # MAE at least 10% lower than the mean predictor
      r2_ci_lower_above: 0.0
      spearman_ci_lower_above: 0.0

  zscore_band:
    kind: ordinal_classification
    primary_metric: macro_f1
    secondary_metrics:
      [balanced_accuracy, accuracy, per_class_precision, per_class_recall, confusion_matrix,
       quadratic_weighted_kappa, within_one_band_accuracy, roc_auc_ovr_macro, log_loss]
    minimum:
      macro_f1_gain_vs_baseline: 0.10
      balanced_accuracy_ci_lower_above_chance: true    # chance = 1 / number of classes
      qwk_ci_lower_above: 0.0
      roc_auc_ovr_macro_ci_lower_above: 0.5
      log_loss_below_baseline: true

  degree_category:
    kind: nominal_classification
    primary_metric: macro_f1
    secondary_metrics:
      [balanced_accuracy, accuracy, per_class_precision, per_class_recall, confusion_matrix,
       roc_auc_ovr_macro, log_loss]
    minimum:
      macro_f1_gain_vs_baseline: 0.10
      balanced_accuracy_ci_lower_above_chance: true
      roc_auc_ovr_macro_ci_lower_above: 0.5
      log_loss_below_baseline: true

  university_group:
    kind: nominal_classification
    definition: universities grouped by region (groups fixed in Phase 3)
    primary_metric: macro_f1
    secondary_metrics:
      [balanced_accuracy, accuracy, per_class_precision, per_class_recall, confusion_matrix,
       roc_auc_ovr_macro, log_loss]
    minimum:
      macro_f1_gain_vs_baseline: 0.10
      balanced_accuracy_ci_lower_above_chance: true
      roc_auc_ovr_macro_ci_lower_above: 0.5
      log_loss_below_baseline: true

# "Intended goal achieved" is NOT a model target (researcher's decision). The gap between the
# student's target and their prediction sets the recommendation mode: close the gap, or strengthen.

# Applies to every classification target.
calibration:
  ece_bins: 10
  max_ece: 0.10
  brier_skill_score_ci_lower_above: 0.0     # better than predicting training class frequencies
  reliability_plot: required
  post_hoc_calibration_allowed: temperature scaling fitted on the validation set only (one network, not an ensemble)

# Multi-task model: per-task check against the single-task model of the same architecture.
negative_transfer:
  definition: >-
    For a task, the multi-task model's validation primary metric is worse than the single-task
    model's and the 95% paired-bootstrap CI of the difference excludes zero.

# ---------------------------------------------------------------------------------------------
# Non-prediction parts (judged by tests, expert review and user testing)
# ---------------------------------------------------------------------------------------------
recommendation:
  automated:
    every_recommendation_has_reason_and_evidence_label: 1.00     # share of recommendations
    rule_unit_tests_pass: 1.00
    similar_profiles_closer_than_random: true                   # mean distance, test-set check
  expert_review:
    instrument: 1-5 rating of relevance, actionability, appropriateness for a 15-16 year old, per example profile
    example_profiles: [strong, average, weak]
    minimum_median: 4
  modes: [close_the_gap, strengthen]                             # chosen from the gap status
  user_test:
    minimum_median_usefulness: 4                                 # 1-5 Likert

gap_analysis:
  automated:
    scenario_tests_correct: 1.00
    only_supplied_or_data_derived_cutoffs: true
  retrospective_check:
    description: >-
      On the test set, the gap status computed from the predicted Z-score and the respondent's stated
      target is compared with whether the respondent actually reached that target.
    primary_metric: balanced_accuracy
    minimum_ci_lower_above: 0.5

xai:
  automated:
    local_additivity_max_abs_error: 0.000001      # explanation shares sum to prediction minus baseline
    top5_stability_min_spearman: 0.80             # same student, repeated explanation runs
    global_agreement_reported: SHAP vs permutation importance (Spearman), reported not thresholded
  user_test:
    comprehension_questions_min_correct: 0.70     # share of correct answers about "why this result"

chatbot:
  automated_test_set_size: 30
  invented_numbers_max: 0                         # every number must come from the fact sheet or the user
  out_of_scope_refusal_min: 1.00                  # medical, psychological, unrelated questions
  says_unsure_when_unsupported_min: 0.90
  support_tool_notice_visible: true
  max_response_seconds: 10
  user_test:
    minimum_median_clarity: 4                     # 1-5 Likert

user_testing:
  testers: 5                                      # students who have recently finished O/L
  analysis: descriptive against thresholds (too few for statistical tests)

usability:
  sus_min: 68                                     # System Usability Scale average (Sauro, 2011)
